<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Sync</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg:    #f7f4ef;
  --bg2:   #ffffff;
  --card:  #ffffff;
  --card2: #f2efe9;
  --border:#e2dbd0;
  --gold:  #c9a84c;
  --gold-l:#e5c878;
  --gold-d:#8a6b22;
  --text:  #1a1f35;
  --text2: #5a657a;
  --text3: #9aa0b2;
  --ok:    #16a34a;
  --warn:  #d97706;
  --err:   #dc2626;
  --info:  #2563eb;
}
body {
  font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
  font-size: 15px;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 12% 18%, rgba(195,188,172,0.32) 0%, transparent 48%),
    radial-gradient(ellipse at 90% 80%, rgba(210,202,185,0.26) 0%, transparent 44%),
    radial-gradient(ellipse at 55% 50%, rgba(220,215,205,0.14) 0%, transparent 60%),
    linear-gradient(128deg, rgba(228,222,210,0.22) 0%, transparent 42%),
    linear-gradient(220deg, transparent 45%, rgba(200,194,180,0.14) 60%, transparent 74%),
    linear-gradient(320deg, rgba(218,211,198,0.18) 0%, transparent 38%);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d5cfc5; border-radius: 2px; }

/* ── カレンダーボタン ─────────────────────────── */
input[type="date"] { color-scheme: light; }
input[type="date"]::-webkit-calendar-picker-indicator {
  cursor: pointer;
  width: 18px; height: 18px;
  padding: 3px;
  border-radius: 5px;
  background-color: rgba(201,168,76,.15);
  border: 1px solid rgba(201,168,76,.50);
  filter: sepia(55%) saturate(480%) hue-rotate(358deg) brightness(0.82);
  transition: background-color .15s, border-color .15s;
}
input[type="date"]::-webkit-calendar-picker-indicator:hover {
  background-color: rgba(201,168,76,.28);
  border-color: var(--gold);
}

/* ── Sidebar ─────────────────────────────────── */
.sidebar {
  width: 240px; min-width: 240px;
  background: #0d1526;
  border-right: 1px solid rgba(201,168,76,0.18);
  display: flex; flex-direction: column;
}
.logo { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.logo-name {
  font-size: 20px; font-weight: 800; letter-spacing: 4px;
  white-space: nowrap;
  background: linear-gradient(120deg, #a07030, var(--gold-l), var(--gold), #c08020, var(--gold-l));
  background-size: 300% auto;
  animation: shimmer 8s linear infinite;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
@keyframes shimmer {
  0%   { background-position: 0% center; }
  100% { background-position: 300% center; }
}
.logo-tagline { font-size: 11px; color: rgba(220,230,248,0.35); letter-spacing: 2px; margin-top: 3px; }
.logo-facility { font-size: 12px; color: rgba(220,230,248,0.50); margin-top: 5px; }
.nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  font-size: 15px; color: rgba(220,230,248,0.58);
  transition: all 0.28s cubic-bezier(0.16,1,0.3,1); margin-bottom: 3px;
  border: 1px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(220,230,248,0.92); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(201,168,76,.18), rgba(201,168,76,.06));
  color: var(--gold); border-color: rgba(201,168,76,.28);
}
.nav-icon { font-size: 17px; width: 22px; text-align: center; }
.sidebar-footer {
  padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.07);
  font-size: 12px; color: rgba(220,230,248,0.28); line-height: 1.8;
}

/* ── Main ────────────────────────────────────── */
.main { flex: 1; overflow-y: auto; padding: 28px 32px; }
.page-title {
  font-size: 20px; font-weight: 600; color: var(--text);
  margin-bottom: 22px; display: flex; align-items: center; gap: 10px;
}
.page-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}

/* ── Cards ───────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 22px; margin-bottom: 16px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.06);
}
.card-title {
  font-size: 13px; font-weight: 600; color: var(--text2);
  letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }

.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.06);
}
.stat-value { font-size: 34px; font-weight: 700; color: var(--gold-d); line-height: 1; }
.stat-label { font-size: 13px; color: var(--text2); margin-top: 5px; letter-spacing: 1px; }

/* ── Table ───────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: left; padding: 8px 12px;
  font-size: 13px; font-weight: 600; color: var(--text2);
  letter-spacing: .8px; border-bottom: 2px solid var(--border);
  background: #f5f2ec;
}
td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
tr:hover td { background: rgba(201,168,76,0.05); }
tr:last-child td { border-bottom: none; }

/* ── Buttons ─────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px; font-size: 14px;
  font-weight: 500; cursor: pointer; border: none; transition: all .15s;
  font-family: inherit;
}
.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold-d));
  color: #fff8e8;
}
.btn-gold:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(138,107,34,0.28); }
.btn-ghost {
  background: transparent; color: var(--text2);
  border: 1px solid var(--border);
}
.btn-ghost:hover { border-color: var(--gold); color: var(--gold-d); background: rgba(201,168,76,0.06); }
.btn-danger {
  background: rgba(220,38,38,.07); color: var(--err);
  border: 1px solid rgba(220,38,38,.22);
}
.btn-sm { padding: 5px 11px; font-size: 13px; }

/* ── Form ────────────────────────────────────── */
.form-group { margin-bottom: 15px; }
.form-label {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--text2); letter-spacing: .8px; margin-bottom: 6px;
}
.form-input, .form-select, .form-textarea {
  width: 100%; background: #faf8f5; border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; color: var(--text);
  font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s;
  font-family: inherit;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.13);
}
.form-select option { background: #fff; color: var(--text); }
.form-textarea { resize: vertical; min-height: 72px; }

/* ── Badge ───────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 500;
}
.badge-gold { background: rgba(201,168,76,.15); color: var(--gold-d); border: 1px solid rgba(201,168,76,.28); }
.badge-ok   { background: rgba(22,163,74,.1);   color: #15803d; border: 1px solid rgba(22,163,74,.2); }
.badge-warn { background: rgba(217,119,6,.1);   color: #b45309; border: 1px solid rgba(217,119,6,.2); }
.badge-err  { background: rgba(220,38,38,.1);   color: #b91c1c; border: 1px solid rgba(220,38,38,.2); }
.badge-info { background: rgba(37,99,235,.1);   color: #1d4ed8; border: 1px solid rgba(37,99,235,.2); }

/* ── Alert ───────────────────────────────────── */
.alert {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 12px 15px; border-radius: 8px; font-size: 14px; margin-bottom: 8px;
}
.alert-warn { background: rgba(217,119,6,.08);  border: 1px solid rgba(217,119,6,.28);  color: #92400e; }
.alert-err  { background: rgba(220,38,38,.07);  border: 1px solid rgba(220,38,38,.25);  color: #991b1b; }
.alert-ok   { background: rgba(22,163,74,.07);  border: 1px solid rgba(22,163,74,.25);  color: #166534; }
.alert-info { background: rgba(37,99,235,.07);  border: 1px solid rgba(37,99,235,.22);  color: #1e40af; }

/* ── Modal ───────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(20,25,45,0.52);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(4px);
}
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px; width: 90%; max-width: 600px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.18);
}
.modal-title { font-size: 17px; font-weight: 600; color: var(--gold-d); margin-bottom: 18px; }

/* ── Day tags ────────────────────────────────── */
.day-tag {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 13px; font-weight: 600;
}
.day-active   { background: rgba(201,168,76,.18); color: #7a5e1c; border: 1px solid rgba(201,168,76,.42); }
.day-inactive { background: #f2efe9;              color: var(--text3); border: 1px solid var(--border); }

/* ── Tabs ────────────────────────────────────── */
.tab-bar {
  display: flex; gap: 2px; margin-bottom: 18px;
  border-bottom: 1px solid var(--border); padding-bottom: 0;
}
.tab {
  padding: 8px 16px; font-size: 14px; font-weight: 500;
  color: var(--text2); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .30s cubic-bezier(0.16,1,0.3,1);
}
.tab.active { color: var(--gold-d); border-bottom-color: var(--gold); }
.tab:hover  { color: var(--text); }

/* ── Template chips ──────────────────────────── */
.chip {
  display: inline-block; padding: 4px 10px;
  background: #faf7f2; border: 1px solid var(--border);
  border-radius: 20px; font-size: 13px; color: var(--text2);
  cursor: pointer; margin: 2px; transition: all .25s cubic-bezier(0.16,1,0.3,1);
}
.chip:hover { border-color: var(--gold); color: var(--gold-d); background: rgba(201,168,76,.08); }

/* ── Section header ──────────────────────────── */
.sec-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}

/* ── Empty state ─────────────────────────────── */
.empty { text-align: center; padding: 40px 24px; color: var(--text3); font-size: 14px; }

/* ── Checkbox ────────────────────────────────── */
.chk-lbl {
  display: flex; align-items: center; gap: 7px;
  cursor: pointer; font-size: 14px; color: var(--text);
}
.chk-lbl input[type="checkbox"] { accent-color: var(--gold); width: 16px; height: 16px; }

/* ── Note item ───────────────────────────────── */
.note-item {
  padding: 14px; background: #faf8f5; border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 7px; transition: border-color .30s ease, box-shadow .30s ease, transform .30s ease;
}
.note-item:hover { border-color: var(--gold); box-shadow: 0 2px 10px rgba(201,168,76,0.13); }

/* ══ Animations & Effects ══════════════════════════════════════════════════ */

/* ── キーフレーム定義 ── */
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(24px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeInScale {
  from { opacity:0; transform:scale(0.90) translateY(16px); }
  to   { opacity:1; transform:scale(1)    translateY(0); }
}
@keyframes pageFadeOut {
  to { opacity:0; transform:translateY(-12px) scale(0.98); pointer-events:none; }
}
@keyframes pageFadeIn {
  from { opacity:0; transform:translateY(28px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes toastSlideIn {
  from { opacity:0; transform:translateX(110%) scale(0.9); }
  to   { opacity:1; transform:translateX(0)   scale(1); }
}
@keyframes toastSlideOut {
  to { opacity:0; transform:translateX(110%) scale(0.9); }
}
@keyframes rowIn {
  from { opacity:0; transform:translateX(-14px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes overlayIn {
  from { opacity:0; backdrop-filter:blur(0px); }
  to   { opacity:1; backdrop-filter:blur(6px); }
}
@keyframes goldPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(201,168,76,0); }
  50%      { box-shadow: 0 0 0 6px rgba(201,168,76,0.18); }
}
@keyframes sidebarGlow {
  0%,100% { opacity:.18; }
  50%      { opacity:.38; }
}
@keyframes floatY {
  0%,100% { transform:translateY(0px); }
  50%      { transform:translateY(-5px); }
}
@keyframes ripple {
  from { transform:scale(0); opacity:.5; }
  to   { transform:scale(4); opacity:0; }
}
@keyframes gradientBorder {
  0%   { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
@keyframes statCountUp {
  from { opacity:0; transform:translateY(10px) scale(0.85); }
  to   { opacity:1; transform:translateY(0)    scale(1); }
}
@keyframes slideInLeft {
  from { opacity:0; transform:translateX(-20px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes titleLine {
  from { transform:scaleX(0); transform-origin:left; }
  to   { transform:scaleX(1); transform-origin:left; }
}
@keyframes navPop {
  0%   { transform:scale(1); }
  40%  { transform:scale(1.04); }
  100% { transform:scale(1); }
}
@keyframes badgePulse {
  0%,100% { transform:scale(1); }
  50%      { transform:scale(1.08); }
}
@keyframes cardShimmer {
  0%   { background-position:-200% 0; }
  100% { background-position: 200% 0; }
}

/* ── ページ遷移 ── */
.page-enter { animation: pageFadeIn  0.55s cubic-bezier(0.16,1,0.3,1) both; }
.page-exit  { animation: pageFadeOut 0.32s cubic-bezier(0.4,0,1,1) forwards; pointer-events:none; }

/* ── モーダル ── */
.modal-overlay {
  animation: overlayIn 0.35s ease both;
  backdrop-filter: blur(6px);
}
.modal {
  animation: fadeInScale 0.48s cubic-bezier(0.34,1.46,0.64,1) both;
}

/* ── カード ── */
.card {
  animation: fadeInUp 0.55s cubic-bezier(0.16,1,0.3,1) both;
  transition: box-shadow 0.35s ease, transform 0.35s ease, border-color 0.35s ease;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 0 0 1px rgba(201,168,76,0.14);
}

/* ── stat カード ── */
.stat-card {
  animation: fadeInUp 0.60s cubic-bezier(0.16,1,0.3,1) both;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
  position: relative; overflow: hidden;
}
.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 36px rgba(0,0,0,0.12), 0 0 0 1px rgba(201,168,76,0.20);
}
.stat-card::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(105deg, transparent 40%, rgba(201,168,76,0.07) 50%, transparent 60%);
  background-size:200% 100%;
  opacity:0; transition:opacity 0.3s;
}
.stat-card:hover::after { opacity:1; animation: cardShimmer 0.7s ease; }
.stat-value {
  animation: statCountUp 0.65s cubic-bezier(0.16,1,0.3,1) both;
}

/* ── テーブル行 stagger ── */
tbody tr { animation: rowIn 0.40s cubic-bezier(0.16,1,0.3,1) both; }
tbody tr:nth-child(1)  { animation-delay:.04s }
tbody tr:nth-child(2)  { animation-delay:.08s }
tbody tr:nth-child(3)  { animation-delay:.12s }
tbody tr:nth-child(4)  { animation-delay:.16s }
tbody tr:nth-child(5)  { animation-delay:.20s }
tbody tr:nth-child(6)  { animation-delay:.24s }
tbody tr:nth-child(7)  { animation-delay:.28s }
tbody tr:nth-child(8)  { animation-delay:.32s }
tbody tr:nth-child(9)  { animation-delay:.36s }
tbody tr:nth-child(10) { animation-delay:.40s }
tbody tr:nth-child(n+11) { animation-delay:.44s }
tr:hover td {
  background: rgba(201,168,76,0.07);
  transition: background 0.25s ease;
}

/* ── ボタン ── */
.btn {
  transition: all .28s cubic-bezier(0.16,1,0.3,1), transform .16s;
  position: relative; overflow: hidden;
}
.btn::after {
  content:''; position:absolute;
  width:100%; height:100%; top:0; left:0;
  border-radius: inherit;
  background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
  transform:scale(0); opacity:0;
  transition: transform 0s, opacity 0s;
  pointer-events:none;
}
.btn:active::after { animation: ripple 0.45s ease-out forwards; }
.btn:active { transform:scale(0.96) !important; }
.btn-gold {
  transition: all .30s cubic-bezier(0.16,1,0.3,1);
}
.btn-gold:hover {
  opacity:.95; transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(138,107,34,.38), 0 2px 6px rgba(138,107,34,.20);
}
.btn-ghost:hover {
  border-color: var(--gold);
  color: var(--gold-d);
  background: rgba(201,168,76,0.06);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(201,168,76,0.12);
  transition: all .28s cubic-bezier(0.16,1,0.3,1);
}

/* ── ナビゲーション ── */
.nav-item {
  transition: all 0.28s cubic-bezier(0.16,1,0.3,1);
}
.nav-item:hover {
  background: rgba(255,255,255,0.09);
  color: rgba(220,230,248,0.95);
  transform: translateX(3px);
}
.nav-item.active {
  animation: navPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 0 18px rgba(201,168,76,0.15);
}
.nav-item.active .nav-icon {
  animation: floatY 3.2s ease-in-out infinite;
}

/* ── サイドバー装飾グロー ── */
.sidebar {
  position: relative; overflow: hidden;
}
.sidebar::before {
  content:''; position:absolute;
  width:180px; height:180px; border-radius:50%;
  background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
  top:-60px; left:-60px;
  animation: sidebarGlow 5s ease-in-out infinite;
  pointer-events:none;
}
.sidebar::after {
  content:''; position:absolute;
  width:120px; height:120px; border-radius:50%;
  background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
  bottom:80px; right:-30px;
  animation: sidebarGlow 7s ease-in-out infinite reverse;
  pointer-events:none;
}

/* ── ロゴ ── */
.logo-name {
  transition: letter-spacing 0.4s ease;
}
.logo:hover .logo-name { letter-spacing: 6px; }

/* ── ページタイトル ── */
.page-title {
  animation: slideInLeft 0.55s cubic-bezier(0.16,1,0.3,1) both;
}
.page-title::after {
  animation: titleLine 0.70s cubic-bezier(0.16,1,0.3,1) 0.2s both;
}

/* ── フォームフォーカス ── */
.form-input, .form-select, .form-textarea {
  transition: border-color .30s ease, box-shadow .30s ease, transform .20s ease;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(201,168,76,0.14), 0 2px 8px rgba(201,168,76,0.10);
  transform: translateY(-1px);
}

/* ── タブ ── */
.tab {
  transition: all .28s cubic-bezier(0.16,1,0.3,1);
  position: relative;
}
.tab.active::before {
  content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px;
  background: linear-gradient(90deg, var(--gold), var(--gold-d));
  border-radius:2px 2px 0 0;
  animation: titleLine 0.35s cubic-bezier(0.16,1,0.3,1) both;
}
.tab:hover { color: var(--text); transform: translateY(-1px); }

/* ── バッジ ── */
.badge { transition: transform .25s ease, box-shadow .25s ease; }
.badge:hover {
  transform: scale(1.08);
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

/* ── チップ ── */
.chip {
  transition: all .28s cubic-bezier(0.16,1,0.3,1);
}

// ↓↓↓ デプロイ時にバージョンを更新し、GitHub Pages の URL を設定してください ↓↓↓
const APP_VERSION = '2.1.5';
const UPDATE_CHECK_URL = 'https://ar3217799-lgtm.github.io/serenova/version.json';
const UPDATE_ORIGIN = 'https://ar3217799-lgtm.github.io';
// ↑↑↑ 設定箇所ここまで ↑↑↑

// SHA-256 ハッシュ（Web Crypto API 使用）
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// セマンティックバージョン比較（a > b なら true）
function isNewerVersion(a, b) {
  const av = (a || '0').split('.').map(Number);
  const bv = (b || '0').split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    if ((av[i] || 0) > (bv[i] || 0)) return true;
    if ((av[i] || 0) < (bv[i] || 0)) return false;
  }
  return false;
}

// バージョン確認（起動時に非同期で実行）
async function checkForUpdates(setUpdateInfo) {
  // 設定前はスキップ
  if (UPDATE_CHECK_URL.includes('[YOUR_GITHUB')) return;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 7000);
    const res = await fetch(UPDATE_CHECK_URL + '?_=' + Date.now(), {
      cache: 'no-store',
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if (!res.ok) return;
    const info = await res.json();
    // 必須フィールド検証
    if (!info.version || !info.sha256 || !info.fileUrl) return;
    // オリジン検証（設定URLと一致するか）
    try {
      const u = new URL(info.fileUrl);
      if (u.origin !== UPDATE_ORIGIN) return;
    } catch {
      return;
    }
    // バージョンが新しい場合のみ通知
    if (!isNewerVersion(info.version, APP_VERSION)) return;
    // ダウングレード防止（localStorage に最後適用バージョンを記録）
    const applied = localStorage.getItem('serenova_applied_version') || '0';
    if (!isNewerVersion(info.version, applied)) return;
    setUpdateInfo(info);
  } catch {/* オフライン等は無視 */}
}

// アップデートファイルのダウンロード＆適用
async function downloadUpdate(info, setProgress) {
  try {
    setProgress('downloading');
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 30000);
    const res = await fetch(info.fileUrl, {
      cache: 'no-store',
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('ダウンロード失敗 (HTTP ' + res.status + ')');
    const html = await res.text();

    // ── SHA-256 整合性検証 ──
    setProgress('verifying');
    const hash = await sha256Hex(html);
    if (hash !== info.sha256) throw new Error('整合性チェック失敗：ファイルが破損している可能性があります');

    // ── PyWebView モード：Python API 経由でファイル更新 ──
    if (window.pywebview?.api?.update_app) {
      setProgress('applying');
      const ok = await window.pywebview.api.update_app(html, APP_VERSION, info.version);
      if (!ok) throw new Error('ファイル書き込み失敗');
      localStorage.setItem('serenova_applied_version', info.version);
      setProgress('done');
      setTimeout(() => location.reload(), 2000);
    } else {
      // ── ブラウザモード：新しいファイルをダウンロード ──
      const blob = new Blob([html], {
        type: 'text/html;charset=utf-8'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'SmartSync.html';
      a.click();
      URL.revokeObjectURL(url);
      localStorage.setItem('serenova_applied_version', info.version);
      setProgress('downloaded');
    }
  } catch (e) {
    setProgress('error:' + e.message);
  }
}

function autoKana(name) {
  if (!name) return '';
  if (/^[぀-ヿ\sー·]+$/.test(name))
    return name.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 96));
  return name.split(/[\s　]+/).map(p => _readKanji(p)).join(' ');
}
function _readKanji(t) {
  if (!t) return '';
  if (SURNAME_R[t]) return SURNAME_R[t];
  for (const n of [3, 2, 1]) {
    const s = t.slice(0, n), g = t.slice(n);
    if (SURNAME_R[s]) return SURNAME_R[s] + _readGiven(g);
  }
  return _readGiven(t);
}
function _readGiven(t) {
  return [...t].map(c => CHAR_R[c] || c).join('');
}

  return ka.localeCompare(kb, 'ja');
});

/* ── 月の第N週を返す（利用頻度判定用） ── */
const getWeekOfMonth = dateStr => {
  const d = new Date(dateStr);
  const dow = d.getDay();
  let count = 0;
  for (let i = 1; i <= d.getDate(); i++) {
    if (new Date(d.getFullYear(), d.getMonth(), i).getDay() === dow) count++;
  }
  return count; // 1〜5
};

/* ── 利用頻度ラベル ── */
const fmtSchedule = weeks => {
  if (!weeks || weeks.length === 0 || weeks.length >= 5) return '毎週';
  return `第${[...weeks].sort((a, b) => a - b).join('・')}週`;
};

/* ── レク基準日から2週サイクルでレク有無を判定 ── */
const calcHasRec = (baseDate, targetDate) => {
  if (!baseDate || !targetDate) return false;
  const b = new Date(baseDate + 'T00:00:00');
  const t = new Date(targetDate + 'T00:00:00');
  const bMon = new Date(b.getTime() - ((b.getDay() || 7) - 1) * 86400000);
  const tMon = new Date(t.getTime() - ((t.getDay() || 7) - 1) * 86400000);
  return Math.round((tMon - bMon) / 604800000) % 2 === 0;
};
const calcServiceContent = (bath, rehabCategory, hasRec) => {
  const r = !!rehabCategory;
  if (r && bath && hasRec) return 'リハ・入浴・レク';
  if (r && bath && !hasRec) return 'リハ・入浴';
  if (r && !bath && hasRec) return 'リハ・レク';
  if (r && !bath && !hasRec) return 'リハ';
  if (!r && bath && hasRec) return '入浴・レク';
  if (!r && bath && !hasRec) return '入浴';
  if (!r && !bath && hasRec) return 'レク';
  return 'デイサービス';
};
const generateKarteRecords = (data, date, entries) => {
  const dow = getDOW(date);
  const hasRec = calcHasRec(data.recBaseDate || '2026-04-27', date);
  const valid = entries.filter(e => e.userName);

  // 当日の時間割スロットごとの空き人数をトラッキング（振替者の割り振りに使う）
  const todaySlots = (data.rehabSchedule[dow] || []).map(s => ({
    ...s,
    users: [...s.users]
  }));
  const slotCount = {}; // time → 現在の人数（通常来所者 + 振替配置済み）
  todaySlots.forEach(s => {
    slotCount[s.time] = s.users.length;
  });

  // 振替者に当日スロットを割り当てる（同区分優先・5名上限）
  const assignSubstituteSlot = rehabCategory => {
    if (!rehabCategory) return '';
    // ① 同区分 & 空きあり
    const sameCat = todaySlots.find(s => s.category === rehabCategory && (slotCount[s.time] || 0) < 5);
    if (sameCat) {
      slotCount[sameCat.time]++;
      return sameCat.time;
    }
    // ② 区分問わず空きあり（当日に同区分スロットがない場合）
    const anySlot = todaySlots.find(s => (slotCount[s.time] || 0) < 5);
    if (anySlot) {
      slotCount[anySlot.time]++;
      return anySlot.time;
    }
    return ''; // スロット満員
  };
  return valid.map(entry => {
    const srcDay = entry.substituteDay || dow;
    const dm = (data.dayMasters[srcDay] || []).find(x => x.userName === entry.userName);
    // エントリに保存された値を優先し、なければ dayMasters の値を使う（?? は null/undefined のみ fallback）
    const bath = entry.bath ?? dm?.bath ?? false;
    const bathMethod_ = entry.bathMethod ?? dm?.bathMethod ?? '';
    const toiletAssist_ = entry.toiletAssist ?? dm?.toiletAssist ?? false;
    const rehabCategory = entry.rehabCategory ?? dm?.rehabCategory ?? '';
    let rehabTime = '';
    if (!entry.substituteDay) {
      // 通常来所：当日の時間割から名前を検索
      const slot = todaySlots.find(s => s.users.includes(entry.userName));
      rehabTime = slot?.time || '';
    } else {
      // 振替来所：当日スロットの空きを確認して自動割り当て
      rehabTime = assignSubstituteSlot(rehabCategory);
    }
    return {
      id: uid(),
      date,
      dayOfWeek: dow,
      userName: entry.userName,
      substituteDay: entry.substituteDay || null,
      bath,
      bathMethod: bathMethod_,
      toiletAssist: toiletAssist_,
      rehabCategory,
      rehabTime,
      hasRec,
      serviceContent: calcServiceContent(bath, rehabCategory, hasRec),
      careComment: '',
      rehabComment: ''
    };
  });
};

/* ══ Contradiction Checker ══════════════════════════════════════════════════ */
function checkContradictions(data) {
  const issues = [];
  const karteRecords = data.karteRecords || [];

  /* 1. 休み連絡 ↔ 来所記録の矛盾
     ① カルテが存在する → 確実な来所証拠 → ERROR（カルテ削除 or 連絡ノート修正で解消）
     ② カルテなし・当日入力のみ → WARNING（当日入力削除 or 連絡ノート修正で解消）*/
  data.contactNotes.forEach(note => {
    if (note.category !== '休み' || !note.targetDate) return;

    // 先に当日入力の有無を確認（両ブランチで使う）
    const att = data.dailyAttendance.find(a => a.date === note.targetDate);
    const attExists = !!(att && att.entries.some(e => e.userName === note.userName));

    // ① カルテ記録あり → ERROR
    const karteExists = karteRecords.some(k => k.date === note.targetDate && k.userName === note.userName);
    if (karteExists) {
      issues.push({
        type: 'error',
        fix: 'karte',
        fixType: 'delete_karte',
        userName: note.userName,
        date: note.targetDate,
        canRemoveAttendance: attExists,
        // 当日入力にも記録があれば両方のボタンを出す
        message: `【矛盾】${note.userName} さん — ${fmtDate(note.targetDate)} : 連絡ノートに「休み」がありますが、カルテが存在します。`,
        detail: `連絡内容: ${(note.details || '').slice(0, 40)} ／ ※ カルテを「修正」してもこのエラーは消えません。カルテを削除するか、連絡ノートのカテゴリを変更してください。`
      });
      return; // カルテチェックが優先（当日入力チェック不要）
    }

    // ② 当日入力のみ → WARNING
    if (attExists) {
      issues.push({
        type: 'warning',
        fix: 'attendance',
        fixType: 'remove_attendance',
        userName: note.userName,
        date: note.targetDate,
        message: `【注意】${note.userName} さん — ${fmtDate(note.targetDate)} : 連絡ノートに「休み」がありますが、当日入力に記録されています。`,
        detail: `連絡内容: ${(note.details || '').slice(0, 40)} ／ 解消: 当日入力から削除 or 連絡ノートのカテゴリを変更`
      });
    }
  });

  /* 2. 登録曜日外の来所（振替なし・隔週スキップ日は除外） */
  data.dailyAttendance.forEach(att => {
    const dow = getDOW(att.date);
    const weekNum = getWeekOfMonth(att.date);
    att.entries.forEach(entry => {
      if (!entry.userName || entry.substituteDay) return;
      const dmEntry = (data.dayMasters[dow] || []).find(dm => dm.userName === entry.userName);
      if (!dmEntry) {
        const registeredDays = DAYS.filter(d => (data.dayMasters[d] || []).some(dm => dm.userName === entry.userName));
        issues.push({
          type: 'warning',
          fix: 'users',
          fixType: 'remove_attendance',
          userName: entry.userName,
          date: att.date,
          message: `【注意】${entry.userName} さん — ${fmtDate(att.date)}（${dow}曜日）は${dow}曜日マスタに未登録です。`,
          detail: `登録曜日: ${registeredDays.length ? registeredDays.join('・') : 'なし'} ／ 解消: 利用者管理 →「${dow}曜日マスタ」に追加 or 当日入力で振替設定`
        });
      } else {
        // 隔週設定なのに来所している場合はスキップ（振替で来所の可能性があるため警告しない）
        const sw = dmEntry.scheduleWeeks;
        const isAllWeeks = !sw || sw.length === 0 || sw.length >= 5;
        if (!isAllWeeks && !sw.includes(weekNum)) {
          // 利用対象外週に来所 → 振替として扱い警告なし
        }
      }
    });
  });

  /* 3. リハビリ区分の不一致（曜日マスタ vs. 時間割） */
  DAYS.forEach(day => {
    (data.rehabSchedule[day] || []).forEach((slot, slotIdx) => {
      if (!slot.category) return;
      slot.users.forEach(uName => {
        if (!uName) return;
        const dm = (data.dayMasters[day] || []).find(x => x.userName === uName);
        if (!dm?.rehabCategory) return;
        if (dm.rehabCategory !== slot.category) {
          issues.push({
            type: 'info',
            fix: 'rehab',
            fixType: 'fix_rehab',
            userName: uName,
            day,
            slotIdx,
            message: `【確認】${uName} さんの ${DAY_NAMES[day]} リハビリ区分が一致しません。`,
            detail: `${day}曜日マスタ: ${dm.rehabCategory} ／ 時間割: ${slot.category} ／ 解消: どちらかを統一`
          });
        }
      });
    });
  });

  /* 4. 振替連絡あり → 当日入力に登録がない */
  data.contactNotes.forEach(note => {
    if (note.category !== '振替' || !note.targetDate) return;
    const att = data.dailyAttendance.find(a => a.date === note.targetDate);
    const found = att && att.entries.some(e => e.userName === note.userName);
    if (!found) {
      issues.push({
        type: 'info',
        fix: 'attendance',
        fixType: 'missing_attendance',
        userName: note.userName,
        date: note.targetDate,
        message: `【確認】${note.userName} さん — ${fmtDate(note.targetDate)} に振替の連絡がありますが、当日入力に登録されていません。`,
        detail: `連絡ノート記録日: ${fmtDate(note.recordDate)} ／ 解消: 当日入力（${fmtDate(note.targetDate)}）に追加`
      });
    }
  });

  /* 5. 入浴非実施の連絡 ↔ カルテに入浴あり（同一人物・同一日）
     ★ カテゴリ「入浴」かつ詳細に非実施キーワードが含まれる場合のみ対象 */
  const isNoBathNote = n => n.category === '入浴' && ['入浴非実施', '非実施', '入浴中止', '入浴なし'].some(k => (n.details || '').includes(k));
  data.contactNotes.forEach(note => {
    if (!isNoBathNote(note) || !note.targetDate) return;
    const karte = (data.karteRecords || []).find(k => k.date === note.targetDate && k.userName === note.userName);
    if (karte && karte.bath) {
      issues.push({
        type: 'error',
        fix: 'karte',
        fixType: 'fix_bath',
        userName: note.userName,
        date: note.targetDate,
        message: `【矛盾】${note.userName} さん — ${fmtDate(note.targetDate)} : 「入浴非実施」の連絡があるのにカルテに入浴が記録されています。`,
        detail: `連絡内容: ${(note.details || '').slice(0, 40)} ／ 解消: 右の「🛁 入浴を修正」ボタン or 連絡ノートを削除`
      });
    }
  });
  return issues;
}
