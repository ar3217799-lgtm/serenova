name: Build Windows exe

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pywebview pyinstaller

      - name: Build exe (onedir)
        working-directory: windows
        run: pyinstaller SmartSync.spec --clean

      - name: Package dist
        shell: powershell
        run: |
          # SmartSync.html をアプリフォルダ内にコピー
          Copy-Item SmartSync.html windows\dist\SmartSync\SmartSync.html
          # フォルダごと zip 化（展開するとそのまま使える構成）
          Compress-Archive -Path windows\dist\SmartSync -DestinationPath SmartSync_Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SmartSync_Windows.zip
          generate_release_notes: true
          body: |
            ## Smart Sync ${{ github.ref_name }}

            ### インストール方法
            1. `SmartSync_Windows.zip` をダウンロードして展開
            2. 展開された `SmartSync` フォルダをそのままデスクトップなどに置く
            3. フォルダ内の `SmartSync.exe` をダブルクリックで起動

            ### 更新方法（既存ユーザー）
            アプリ起動時に自動で更新通知が表示されます。
            「今すぐ更新」をクリックするだけで完了します。
