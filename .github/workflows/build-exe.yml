name: Build Windows exe

on:
  push:
    tags:
      - 'v*'          # git tag v2.2.0 をプッシュしたら自動ビルド

permissions:
  contents: write     # リリース作成に必要

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pywebview pyinstaller

      - name: Build exe
        working-directory: windows
        run: pyinstaller SmartSync.spec --clean

      - name: Package dist
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist_package
          Copy-Item windows\dist\SmartSync.exe dist_package\SmartSync.exe
          Copy-Item SmartSync.html dist_package\SmartSync.html
          Compress-Archive -Path dist_package\* -DestinationPath SmartSync_Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SmartSync_Windows.zip
          generate_release_notes: true
          body: |
            ## Smart Sync ${{ github.ref_name }}

            ### インストール方法
            1. `SmartSync_Windows.zip` をダウンロード・展開
            2. `SmartSync.exe` と `SmartSync.html` を同じフォルダに置く
            3. `SmartSync.exe` を起動

            ### 更新方法（既存ユーザー）
            アプリ起動時に自動で更新通知が表示されます。
            「今すぐ更新」をクリックするだけで完了します。
